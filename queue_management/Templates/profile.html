{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white text-center">

                    <h2>👤 My Profile</h2>

                </div>

                <div class="card-body">

                    <div class="text-center mb-4">

                        <i class="bi bi-person-circle text-primary" style="font-size:90px;"></i>

                        <h3 class="mt-3">{{ request.user.username }}</h3>

                        <p class="text-muted">{{ request.user.email }}</p>

                    </div>

                    <div class="row text-center">

                        <div class="col-md-3 mb-3">

                            <div class="card shadow-sm">

                                <div class="card-body">

                                    <h2 class="text-primary">{{ total_appointments }}</h2>

                                    <p>Total</p>

                                </div>

                            </div>

                        </div>

                        <div class="col-md-3 mb-3">

                            <div class="card shadow-sm">

                                <div class="card-body">

                                    <h2 class="text-warning">{{ pending }}</h2>

                                    <p>Pending</p>

                                </div>

                            </div>

                        </div>

                        <div class="col-md-3 mb-3">

                            <div class="card shadow-sm">

                                <div class="card-body">

                                    <h2 class="text-success">{{ confirmed }}</h2>

                                    <p>Confirmed</p>

                                </div>

                            </div>

                        </div>

                        <div class="col-md-3 mb-3">

                            <div class="card shadow-sm">

                                <div class="card-body">

                                    <h2 class="text-info">{{ completed }}</h2>

                                    <p>Completed</p>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
